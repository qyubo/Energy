# 1. 选择接口
source [find interface/cmsis-dap.cfg]

# 2. 【关键】强制使用 HID 模式 (解决 command not found)
cmsis-dap backend hid

# 3. 【关键】开启怪癖模式 (解决 0x0 not implemented)
# 如果 OpenOCD 版本很旧报错说不认识 quirk，就把这一行删掉
cmsis-dap quirk enable

# 4. 选择 SWD 协议
transport select swd

# 5. 降低速度到 1MHz (太快容易不稳)
adapter speed 1000

# 6. 【关键】目标芯片是 F1，绝对不能写成 f4x
source [find target/stm32f1x.cfg]